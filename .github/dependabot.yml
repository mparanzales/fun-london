version: 2

# Dependabot was running with no config, so it opened bumps for everything and
# grouped nothing. PR #141 (sharp 0.33.5 -> 0.35.0) was merged and broke
# typecheck on main, which then stayed red across several merges before anyone
# noticed. This file exists to make that less likely.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # One PR per group instead of a drip of individual bumps, so CI failures
    # are attributable and a bad group can be closed in one action.
    groups:
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: production
        update-types: ["patch"]

    # NOTE ON IGNORES AND SECURITY. An `ignore` here can suppress the version
    # updates that carry a CVE fix, so anything added below must be narrow and
    # must be checked against open Dependabot ALERTS before it goes in.
    #
    # This bit me immediately. sharp was ignored here because 0.35.0 broke
    # typecheck, and 0.35.0 was also the first version to patch four HIGH
    # libvips CVEs. The ignore would have held the repo on a vulnerable sharp
    # indefinitely. 0.35.1 fixed the types export, so the real answer was to
    # move forward to 0.35.3, not to pin backwards. No sharp ignore now.
    ignore:
      # Next.js majors are a deliberate, tested migration, never a drive-by.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

      # @types/node's major tracks the Node major it DESCRIBES, so it must
      # match the runtime, not lead it. Dependabot has now proposed 26 three
      # times (#179, #203) while we run Node 22 everywhere: engines "22.x", CI
      # node-version 22, Vercel 22.x. #182 rejected it and explained why —
      # types ahead of the runtime means TypeScript accepts APIs that do not
      # exist when the code runs: green typecheck, green CI, crash in prod.
      # Safe to ignore per this file's own rule: it is types-only, ships no
      # runtime code, and therefore carries no CVE surface to suppress.
      # When Node moves to 24, raise the pin and drop this entry together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # eslint-config-next's major tracks the NEXT major. next itself is
      # already ignored for majors above, so allowing this one through just
      # produces a red PR every release (#202: 15.5.18 -> 16.2.12 while the
      # app is on Next 15.5.22). Dev-only lint config, no runtime, no CVE
      # surface. Unpin this in the same commit as the Next 16 migration.
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]

      # TypeScript majors are a migration, not a bump. #205 (5.9 -> 6.0) fails
      # typecheck with TS2882 on every CSS side-effect import (globals.css,
      # leaflet.css) — TS 6 needs an ambient module declaration those imports
      # do not have yet. Dev-only compiler, no runtime, no CVE surface.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

      # transformers v4 pulls onnxruntime-node >=1.22, which DROPPED the
      # darwin/x64 native binding (1.24.3 ships linux x64/arm64, darwin arm64,
      # win32 x64/arm64 -- no Intel Mac). Verified by installing 4.2.0: the
      # probe dies with MODULE_NOT_FOUND on onnxruntime_binding.node. The
      # embedding scripts run BOTH in CI (ubuntu, fine) and locally via
      # `pnpm embed-reviews` on an Intel Mac (impossible on v4). v3 pins
      # onnxruntime-node 1.21.0, the last release with napi-v3/darwin/x64.
      # Unpin when the dev machine is Apple Silicon, or embeddings go CI-only.
      - dependency-name: "@huggingface/transformers"
        update-types: ["version-update:semver-major"]
